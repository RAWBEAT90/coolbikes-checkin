name: Mantener Supabase activo

# Llama a la base de datos del check-in dos veces al dia para que el plan
# gratis de Supabase no pause el proyecto por inactividad.
on:
  schedule:
    - cron: '17 14 * * *'   # 8:17 am Cancun
    - cron: '43 23 * * *'   # 6:43 pm Cancun
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping a Supabase
        run: |
          curl -fsS --retry 3 --retry-delay 20 -X POST \
            "https://xibzpuouvveuhxbsmkil.supabase.co/rest/v1/rpc/keepalive" \
            -H "apikey: sb_publishable_imfxa3Su-1ID0V7b0ddqrg_IEiPthk1" \
            -H "Content-Type: application/json" -d '{}'

      # Una vez al mes deja un registro en el repositorio para que GitHub
      # no apague esta tarea automatica (la apaga tras 60 dias sin actividad).
      - uses: actions/checkout@v4
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '17 14 * * *'
      - name: Registro mensual
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '17 14 * * *'
        run: |
          if [ "$(date -u +%d)" = "01" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            date -u +"%Y-%m-%dT%H:%M:%SZ" > .keepalive
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .keepalive
            git commit -m "Mantener activo el despertador" || exit 0
            git push
          fi
