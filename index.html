<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><meta name="theme-color" content="#0F3D2E">
<title>Check-in Cool Bikes</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: one mobile column (max 560px), sticky brand header with progress, one step per screen, sticky action bar.
   Two looks from the Cool Bikes web system: A "Arena" (light) and B "Selva" (dark). Each is a deliberate single look. */
:root{
  --display:'Sora',system-ui,-apple-system,sans-serif; --body:'Inter',system-ui,-apple-system,sans-serif;
  --jungle:#0F3D2E; --cenote:#12B3A6; --cenote-b:#2CD4C4; --coral:#FF6A3D; --sand:#F4EEE1; --sand2:#EAE1CE;
  --bg:#F4EEE1; --card:#FFFFFF; --ink:#10201A; --muted:#4a5a52; --line:#E4DAC6; --field:#FFFFFF;
  --accent:#12B3A6; --accent-ink:#0B7D74; --chip:#FFFFFF; --chip-on:#0F3D2E; --chip-on-ink:#FFFFFF;
  --head:#0F3D2E; --head-ink:#FFFFFF; --danger:#B4400F; --danger-bg:#FDEDE5; --ok:#0B7D74; --ok-bg:#E3F5F2; --warn:#8A5300; --warn-bg:#FFF0D1;
  --bar:#FFFFFF; --shadow:0 2px 12px rgba(16,32,26,.07); --radius:18px;
  color-scheme:light;
}
:root[data-look="selva"]{
  --bg:#0A2A1F; --card:rgba(255,255,255,.055); --ink:#EAF6F2; --muted:#A8CDC2; --line:rgba(255,255,255,.14); --field:rgba(255,255,255,.07);
  --accent:#2CD4C4; --accent-ink:#2CD4C4; --chip:rgba(255,255,255,.05); --chip-on:#2CD4C4; --chip-on-ink:#05241A;
  --head:transparent; --head-ink:#FFFFFF; --danger:#FF9B73; --danger-bg:rgba(255,106,61,.14); --ok:#2CD4C4; --ok-bg:rgba(44,212,196,.12); --warn:#FFC94D; --warn-bg:rgba(255,201,77,.13);
  --bar:#0A2A1F; --shadow:none; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
:root[data-look="selva"] body{background:radial-gradient(120% 60% at 20% 0%,rgba(44,212,196,.22),transparent 60%),radial-gradient(90% 50% at 100% 100%,rgba(255,106,61,.12),transparent 60%),var(--bg);background-attachment:fixed}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--jungle)}
h1,h2,h3{font-family:var(--display);letter-spacing:-.02em;line-height:1.1;text-wrap:balance;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* prototype switcher */
.proto{background:#06261d;color:#cfe;font-size:12.5px;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.proto .in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.proto b{font-family:var(--display);color:#fff;font-weight:600;letter-spacing:.04em;text-transform:uppercase;font-size:11px}
.proto .seg{display:inline-flex;border:1px solid rgba(255,255,255,.25);border-radius:999px;overflow:hidden;margin-left:auto}
.proto .seg button{background:transparent;border:0;color:#cfe;padding:5px 12px;cursor:pointer;font-weight:600;font-size:12.5px}
.proto .seg button.on{background:var(--cenote-b);color:#05241A}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--head);color:var(--head-ink);padding-block:12px 14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
:root[data-look="selva"] header.top{background:rgba(10,42,31,.82);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
header.top .in{max-width:560px;margin:0 auto}
.row1{display:flex;align-items:center;gap:12px}
.logo{line-height:0;color:#fff}
.logo svg{height:38px;width:auto}
.langs{margin-left:auto;display:inline-flex;gap:4px;background:rgba(255,255,255,.1);border-radius:999px;padding:3px}
.langs button{border:0;background:transparent;color:#fff;font-weight:700;font-size:12.5px;padding:6px 11px;border-radius:999px;cursor:pointer;min-width:40px}
.langs button.on{background:var(--cenote);color:#fff}
:root[data-look="selva"] .langs button.on{background:var(--cenote-b);color:#05241A}
.prog{margin-top:12px;display:flex;align-items:center;gap:10px}
.prog .steps{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;flex:1}
.prog .steps i{height:5px;border-radius:9px;background:rgba(255,255,255,.2);transition:background .3s}
.prog .steps i.done{background:var(--cenote-b)}
.prog .lbl{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;opacity:.85;white-space:nowrap}
.prog[hidden]{display:none}

main{padding-block:22px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-ink)}
.lead h2{font-size:clamp(26px,7vw,32px);font-weight:700;margin-top:6px}
.lead p{margin:8px 0 0;color:var(--muted);font-size:15.5px}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:16px}
:root[data-look="selva"] .card{backdrop-filter:blur(6px)}
.f{display:flex;flex-direction:column;gap:7px;min-width:0}
.f > label,.f > .q{font-weight:600;font-size:14.5px}
.req{color:var(--coral);margin-left:2px}
.hint{font-size:13px;color:var(--muted)}
input[type=text],input[type=email],input[type=tel],input[type=date],input[type=number],select,textarea{width:100%;min-height:50px;border:1.5px solid var(--line);background:var(--field);border-radius:14px;padding:12px 14px;font-size:16px;outline:none;transition:border-color .2s}
textarea{min-height:84px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tel{display:grid;grid-template-columns:108px 1fr;gap:8px}
@media(max-width:380px){.two{grid-template-columns:1fr}}
.err input,.err select,.err textarea{border-color:var(--danger)}
.emsg{font-size:13px;color:var(--danger);font-weight:600;display:none}
.err .emsg{display:block}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--chip);border-radius:999px;padding:11px 16px;font-size:14.5px;font-weight:600;cursor:pointer;min-height:46px;transition:.15s;display:inline-flex;align-items:center;gap:7px}
.chip:hover{border-color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--chip-on);border-color:var(--chip-on);color:var(--chip-on-ink)}
.err .chips .chip{border-color:var(--danger)}

.checks{display:flex;flex-direction:column;gap:2px}
.ck{display:flex;gap:12px;align-items:flex-start;padding:11px 4px;border-top:1px solid var(--line);cursor:pointer}
.ck:first-child{border-top:0}
.ck input{appearance:none;flex:0 0 26px;width:26px;height:26px;border:2px solid var(--line);border-radius:8px;background:var(--field);margin:0;display:grid;place-items:center;cursor:pointer;transition:.15s}
.ck input:checked{background:var(--accent);border-color:var(--accent)}
.ck input:checked::after{content:"";width:7px;height:13px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
:root[data-look="selva"] .ck input:checked::after{border-color:#05241A}
.ck span{font-size:15px}
.ck small{display:block;color:var(--muted);font-size:13px}

.flag{border-radius:12px;padding:11px 14px;font-size:14px;font-weight:500;background:var(--danger-bg);color:var(--danger)}
.okbox{border-radius:12px;padding:11px 14px;font-size:14px;background:var(--ok-bg);color:var(--ok);font-weight:500}

/* waiver */
.clause{border:1px solid var(--line);border-radius:14px;background:var(--field);overflow:hidden}
.clause.err{border-color:var(--danger)}
.clause details summary{list-style:none;cursor:pointer;padding:13px 14px;display:flex;gap:10px;align-items:center;font-weight:600;font-size:14.5px}
.clause details summary::-webkit-details-marker{display:none}
.clause .n{font-family:var(--display);color:var(--accent-ink);font-weight:700;min-width:22px}
.clause .chev{margin-left:auto;transition:transform .2s;opacity:.6}
.clause details[open] .chev{transform:rotate(180deg)}
.clause .txt{padding:0 14px 12px 46px;color:var(--muted);font-size:14px}
.clause .ck{border-top:1px solid var(--line);padding:11px 14px}
.sigbox{position:relative;border:2px dashed var(--line);border-radius:14px;background:var(--field);height:180px;touch-action:none}
.sigbox.err{border-color:var(--danger)}
.sigbox canvas{position:absolute;inset:0;width:100%;height:100%;border-radius:12px;cursor:crosshair}
.sigbox .ph{position:absolute;left:16px;right:16px;bottom:34px;border-bottom:1.5px solid var(--line);pointer-events:none}
.sigbox .phl{position:absolute;left:16px;bottom:10px;font-size:12px;color:var(--muted);pointer-events:none}
.sigbox .clr{position:absolute;top:8px;right:8px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;cursor:pointer}
.meta{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}

/* minors */
.minor{display:grid;grid-template-columns:1fr 150px 40px;gap:8px;align-items:end}
@media(max-width:420px){.minor{grid-template-columns:1fr 1fr 40px}}
.icon-btn{height:50px;border:1.5px solid var(--line);background:var(--field);border-radius:14px;cursor:pointer;font-size:18px}
.link-btn{align-self:flex-start;border:0;background:transparent;color:var(--accent-ink);font-weight:700;padding:6px 0;cursor:pointer;font-size:14.5px}

/* action bar */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--bar);border-top:1px solid var(--line);padding-top:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar .in{max-width:560px;margin:0 auto;display:flex;gap:10px}
.btn{border:0;border-radius:999px;font-weight:700;font-size:16px;min-height:54px;padding:0 22px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .15s,box-shadow .2s}
.btn-cta{flex:1;background:var(--coral);color:#fff;box-shadow:0 8px 22px rgba(255,106,61,.32)}
.btn-cta:active{transform:translateY(1px)}
.btn-back{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.bar[hidden]{display:none}

/* welcome + done */
.hero{border-radius:22px;color:#fff;padding:26px 22px;position:relative;overflow:hidden;background:radial-gradient(120% 90% at 15% 0%,rgba(44,212,196,.4),transparent 55%),radial-gradient(100% 100% at 100% 100%,rgba(255,106,61,.28),transparent 55%),linear-gradient(150deg,#0b3226,#0F3D2E 45%,#0a6b63)}
.hero::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.05) 0 2px,transparent 2px 26px);pointer-events:none}
.hero > *{position:relative;z-index:1}
.hero .eyebrow{color:var(--cenote-b)}
.hero h2{font-size:clamp(30px,8vw,40px);font-weight:800;margin-top:8px}
.hero p{margin:10px 0 0;opacity:.92;max-width:40ch}
.tourpill{display:inline-flex;gap:8px;align-items:center;margin-top:16px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:7px 14px;font-size:13.5px;font-weight:600}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.fact{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}
.fact b{display:block;font-family:var(--display);font-size:20px;color:var(--accent-ink)}
.fact span{font-size:12.5px;color:var(--muted)}
.refcode{font-family:var(--display);font-weight:800;font-size:28px;letter-spacing:.04em;border:2px dashed var(--accent);border-radius:14px;padding:12px;text-align:center;color:var(--accent-ink)}
pre.json{background:#06261d;color:#bfe9df;border-radius:14px;padding:14px;font-size:12px;overflow-x:auto;max-height:340px;margin:0}
.done-ic{width:64px;height:64px;border-radius:50%;background:var(--cenote-b);display:grid;place-items:center}
.done-ic::after{content:"";width:16px;height:30px;border:solid #05241A;border-width:0 5px 5px 0;transform:rotate(45deg) translate(-2px,-3px)}
.foot{font-size:12.5px;color:var(--muted);text-align:center}
/* tour picker + language picker */
.sec-q{font-family:var(--display);font-weight:700;font-size:18px;display:flex;align-items:baseline;gap:8px}
.sec-q small{font-family:var(--body);font-weight:500;font-size:13px;color:var(--muted)}
.tours{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tcard{position:relative;border:2px solid var(--line);border-radius:16px;overflow:hidden;background:var(--card);cursor:pointer;padding:0;text-align:left;display:flex;flex-direction:column;transition:border-color .15s,transform .15s;box-shadow:var(--shadow)}
.tcard:hover{border-color:var(--accent)}
.tcard .im{aspect-ratio:4/3;max-width:100%;background:#0F3D2E center/cover no-repeat;position:relative}
.tcard .im.combo{display:grid;grid-template-columns:repeat(2,1fr)}
.tcard .im.combo i{background:center/cover no-repeat}
.tcard .nm{padding:10px 12px 12px;font-family:var(--display);font-weight:700;font-size:15px;line-height:1.2}
.tcard .nm small{display:block;font-family:var(--body);font-weight:500;font-size:12px;color:var(--muted);margin-top:3px}
.tcard .tick{position:absolute;top:8px;right:8px;width:28px;height:28px;border-radius:50%;background:rgba(6,30,22,.55);border:2px solid #fff;display:grid;place-items:center}
.tcard[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 30%,transparent)}
.tcard[aria-pressed="true"] .tick{background:var(--cenote)}
.tcard[aria-pressed="true"] .tick::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
.err .tcard{border-color:var(--danger)}
.lpick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.lbtn{border:2px solid var(--line);background:var(--card);border-radius:14px;min-height:62px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.lbtn b{font-family:var(--display);font-size:16px}
.lbtn span{font-size:12px;color:var(--muted)}
.lbtn[aria-pressed="true"]{border-color:var(--chip-on);background:var(--chip-on);color:var(--chip-on-ink)}
.lbtn[aria-pressed="true"] span{color:inherit;opacity:.85}
.code{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.06em;font-variant-numeric:tabular-nums;background:var(--field);border:1.5px dashed var(--accent);border-radius:14px;padding:12px 14px;color:var(--accent-ink)}
/* guide mode */
.gsel{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gsel .full{grid-column:1/-1}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;font-variant-numeric:tabular-nums}
.stat b{display:block;font-family:var(--display);font-size:26px;line-height:1.1}
.stat span{font-size:12.5px;color:var(--muted)}
.stat.alert b{color:var(--danger)}
.person{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px}
.person.crit{border-left-color:var(--danger)}
.person.warn{border-left-color:var(--warn)}
.person .top{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.person .nm{font-family:var(--display);font-weight:700;font-size:18px}
.person .sub{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pl{font-size:13px;font-weight:600;border-radius:999px;padding:5px 11px}
.pl.crit{background:var(--danger-bg);color:var(--danger)}
.pl.warn{background:var(--warn-bg);color:var(--warn)}
.pl.info{background:var(--ok-bg);color:var(--ok)}
.clean{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:14px}
.clean div{display:flex;justify-content:space-between;gap:10px;padding:11px 14px;border-top:1px solid var(--line);font-size:14.5px}
.clean div:first-child{border-top:0}
.clean span{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.src{font-size:12.5px;color:var(--muted)}
.ex{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;background:var(--warn-bg);color:var(--warn);border-radius:6px;padding:2px 7px;margin-left:6px;vertical-align:middle}
.ghost{border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:10px 16px;font-weight:600;cursor:pointer;color:var(--ink)}
.proto .gbtn{background:var(--coral);color:#fff;border:0;border-radius:999px;padding:5px 12px;font-weight:700;font-size:12.5px;cursor:pointer}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>

 if(el.dataset.w!==undefined){const i=+el.dataset.w; D.w=el.checked?[...new Set([...D.w,i])]:D.w.filter(x=>x!==i); el.closest('.clause').classList.remove('err'); if(el.checked){const d=el.closest('.clause').querySelector('details'); d.open=false; const nx=el.closest('.clause').nextElementSibling?.querySelector('details'); if(nx)nx.open=true} save()}
});

function updateCode(){const b=document.getElementById('bkcode'); if(b)b.textContent=bookingCode()}
function setErr(id,msg){const f=view.querySelector(`[data-f="${id}"]`); if(!f)return; f.classList.add('err'); const m=f.querySelector('.emsg'); if(m)m.textContent=msg;}
function validate(){
 const errs=[]; const need=(id,msg=t('required'))=>{if(!String(D[id]||'').trim()){setErr(id,msg);errs.push(id)}};
 if(step===0){if(!D.tour){view.querySelector('[data-f="tour"]').classList.add('err');errs.push('tour')}}
 if(step===1){need('channel',t('chooseOne'));need('date')}
 if(step===2){['name','last','country'].forEach(k=>need(k)); need('wa'); if(!/^\S+@\S+\.\S+$/.test(D.email)){setErr('email',D.email?t('emailBad'):t('required'));errs.push('email')}}
 if(step===3){need('ride',t('chooseOne'))}
 if(step===4){need('found',t('chooseOne'));need('mk',t('chooseOne'))}
 if(step===5){view.querySelectorAll('.clause').forEach(c=>{const k=c.dataset.cl; const ok=k==='m'?D.wMinor:D.w.includes(+k); if(!ok){c.classList.add('err');c.querySelector('details').open=true;errs.push('w'+k)}});
  if(!D.privacy){view.querySelector('[data-f="privacy"]').classList.add('err');errs.push('privacy')}
  if(!sigDirty){setErr('sig',t('mustSign'));document.getElementById('sigbox').classList.add('err');errs.push('sig')}}
 if(errs.length){const first=view.querySelector('.err'); first?.scrollIntoView({behavior:'smooth',block:'center'})}
 return !errs.length;
}
let sending=false;
document.getElementById('next').addEventListener('click',async()=>{ if(sending||!validate())return;
 if(step===5){ D.sig=sigCanvas.toDataURL('image/png'); const btn=document.getElementById('next'); sending=true; btn.disabled=true; btn.textContent='…';
  let ok=false, why=''; const body=JSON.stringify(payload()); for(let a=0;a<3&&!ok;a++){ if(a) await new Promise(r=>setTimeout(r,1500*a)); try{const r=await fetch(SB_URL+'/rest/v1/checkins',{method:'POST',headers:{...sbHeaders,'Prefer':'return=minimal'},body}); ok=r.ok; if(!ok){why='HTTP '+r.status+' '+(await r.text()).slice(0,120); if(r.status<500)break}}catch(e){why=String(e&&e.message||e)} }
  sending=false; btn.disabled=false; btn.textContent=t('submit');
  if(!ok){let m=view.querySelector('#sendErr'); if(!m){m=document.createElement('div');m.id='sendErr';m.className='flag';view.appendChild(m)} m.textContent=T[lang].sendErr+(why?' ('+why+')':''); m.scrollIntoView({behavior:'smooth',block:'center'}); return}
  try{localStorage.removeItem(KEY)}catch(e){} }
 step=Math.min(step+1,6); render(); window.scrollTo({top:0}); });
document.getElementById('back').addEventListener('click',()=>{step=Math.max(step-1,0);render();window.scrollTo({top:0})});
document.querySelectorAll('.langs button').forEach(b=>b.addEventListener('click',()=>{lang=b.dataset.l;render()}));

// signature pad
let sigCanvas,ctx,drawing=false,sigDirty=false,last=null;
function initSig(){sigCanvas=document.getElementById('sig'); sigDirty=false; const r=sigCanvas.getBoundingClientRect(), dpr=window.devicePixelRatio||1; sigCanvas.width=r.width*dpr; sigCanvas.height=r.height*dpr; ctx=sigCanvas.getContext('2d'); ctx.scale(dpr,dpr); ctx.lineWidth=2.6; ctx.lineCap='round'; ctx.lineJoin='round'; ctx.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue('--ink').trim()||'#10201A';
 const pos=e=>{const b=sigCanvas.getBoundingClientRect();return {x:e.clientX-b.left,y:e.clientY-b.top}};
 sigCanvas.onpointerdown=e=>{drawing=true;last=pos(e);sigCanvas.setPointerCapture(e.pointerId);ctx.beginPath();ctx.arc(last.x,last.y,1.2,0,Math.PI*2);ctx.fillStyle=ctx.strokeStyle;ctx.fill()};
 sigCanvas.onpointermove=e=>{if(!drawing)return;const p=pos(e);ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke();last=p;if(!sigDirty){sigDirty=true;const sb=document.getElementById('sigbox');sb.classList.remove('err');sb.closest('.f').classList.remove('err')}};
 sigCanvas.onpointerup=sigCanvas.onpointercancel=()=>{drawing=false};
 const m=document.getElementById('meta'); if(m)m.textContent=t('meta')+' · '+new Date().toLocaleString(lang==='en'?'en-US':lang==='fr'?'fr-FR':'es-MX',{dateStyle:'medium',timeStyle:'short'});
}
function clearSig(){if(!ctx)return;ctx.clearRect(0,0,sigCanvas.width,sigCanvas.height);sigDirty=false}

if(step===6)step=0;
if(mode==='guide')setMode('guide'); else render();
})();
</script>
